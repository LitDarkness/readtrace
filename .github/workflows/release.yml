name: Release ReadTrace

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Format, lint and test
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          node --check crates/readtrace-server/static/app.js
          bash -n scripts/package-release-macos.sh

  windows:
    name: Package Windows x86_64
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust and OCR tools
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

          choco install tesseract -y --no-progress

          $tesseractExe = Get-Item `
            "C:\Program Files\Tesseract-OCR\tesseract.exe" `
            -ErrorAction SilentlyContinue

          if (-not $tesseractExe) {
              $tesseractExe = Get-ChildItem "C:\Program Files" `
                -Recurse `
                -Filter "tesseract.exe" `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
          }

          if (-not $tesseractExe) {
              throw "tesseract.exe not found after Chocolatey installation"
          }

          $popplerVersion = "26.02.0-0"
          $popplerZip = "$env:TEMP\poppler.zip"
          $popplerRoot = "C:\ProgramData\poppler"

          Invoke-WebRequest `
            -Uri "https://github.com/oschwartz10612/poppler-windows/releases/download/v$popplerVersion/Release-$popplerVersion.zip" `
            -OutFile $popplerZip `
            -UseBasicParsing

          if (Test-Path -LiteralPath $popplerRoot) {
              Remove-Item -LiteralPath $popplerRoot -Recurse -Force
          }

          Expand-Archive `
            -Path $popplerZip `
            -DestinationPath $popplerRoot `
            -Force

          Remove-Item `
            -LiteralPath $popplerZip `
            -Force `
            -ErrorAction SilentlyContinue

          $popplerExe = Get-ChildItem $popplerRoot `
            -Recurse `
            -Filter "pdftoppm.exe" |
            Select-Object -First 1

          if (-not $popplerExe) {
              throw "pdftoppm.exe not found after expanding Poppler archive"
          }

          $pdfinfoExe = Join-Path $popplerExe.Directory.FullName "pdfinfo.exe"

          if (-not (Test-Path -LiteralPath $pdfinfoExe)) {
              throw "pdfinfo.exe not found beside pdftoppm.exe"
          }

          $tesseractExe.Directory.FullName |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $popplerExe.Directory.FullName |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Tesseract: $($tesseractExe.FullName)"
          Write-Host "pdftoppm:  $($popplerExe.FullName)"
          Write-Host "pdfinfo:   $pdfinfoExe"

      - name: Build self-contained package
        shell: powershell
        run: |
          $tesseract = (Get-Command tesseract.exe -ErrorAction Stop).Source
          $pdftoppm = (Get-Command pdftoppm.exe -ErrorAction Stop).Source

          & .\scripts\package-release.ps1 `
            -Version "${{ github.ref_name }}" `
            -TesseractBin $tesseract `
            -PopplerBin $pdftoppm

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: readtrace-windows-x86_64
          path: dist/readtrace-*-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: Package macOS arm64
    needs: test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Show macOS environment
        shell: bash
        run: |
          uname -a
          uname -m
          sw_vers
          brew --version
          brew --prefix

      - name: Build self-contained package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/package-release-macos.sh

      - name: Smoke-test extracted macOS archive
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find dist -maxdepth 1 -type f -name 'readtrace-*-macos-arm64.tar.gz' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "macOS archive was not produced" >&2
            exit 1
          fi

          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "$archive" -C "$smoke_dir"

          (
            cd "$smoke_dir"
            env \
              -u READTRACE_TESSERACT_BIN \
              -u READTRACE_PDFTOPPM_BIN \
              -u READTRACE_PDFINFO_BIN \
              -u READTRACE_TESSDATA_PREFIX \
              -u TESSDATA_PREFIX \
              ./readtrace --format json ocr-check | tee ocr-check.json
          )

          grep -Fq '"tesseract_available": true' "$smoke_dir/ocr-check.json"
          grep -Fq '"pdftoppm_available": true' "$smoke_dir/ocr-check.json"
          grep -Fq '"pdfinfo_available": true' "$smoke_dir/ocr-check.json"
          grep -Fq 'tools/tesseract/tessdata' "$smoke_dir/ocr-check.json"

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: readtrace-macos-arm64
          path: dist/readtrace-*-macos-arm64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - windows
      - macos

    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          sha256sum dist/readtrace-* > dist/SHA256SUMS.txt

          if gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              >/dev/null 2>&1; then

            echo "Release already exists; replacing assets."

            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ReadTrace ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
